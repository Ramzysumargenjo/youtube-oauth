<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>OAuth Callback</title></head>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<h1>YouTube Upload — OAuth Callback</h1>
<p id="status">Menunggu kode…</p>
<pre id="code" style="background:#f0f0f0;padding:12px;word-break:break-all"></pre>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code'), err = q.get('error');
if (code) { document.getElementById('status').textContent = 'Kode otorisasi:'; document.getElementById('code').textContent = code; }
else if (err) { document.getElementById('status').textContent = 'Error: ' + err; }
else { document.getElementById('status').textContent = 'Tidak ada kode di URL.'; }
</script></body></html>
